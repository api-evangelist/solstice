name: Solstice
description: Solstice is a community solar platform that lets households, renters, and businesses benefit from
  renewable energy without installing rooftop panels. Subscribers reserve a portion of a nearby solar farm and
  earn monthly savings on their electric bill through solar credits, while businesses can purchase community
  solar subscriptions and renewable energy credits (RECs). Solstice also offers subscriber-management solutions
  for solar developers and asset owners. Surfaced as a Techstars portfolio company and added to the API
  Evangelist network; no public API surface was found during enrichment.
